services:
  - type: web
    name: shoplearning
    runtime: python
    buildCommand: "pip install -r requirements.txt && bash build.sh"
    startCommand: "gunicorn Myproject.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: shoplearning.onrender.com
      - key: PYTHON_VERSION
        value: 3.13.7