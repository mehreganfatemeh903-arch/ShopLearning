{% extends 'main/base/base_main.html' %}
{% load static %}

{% block title %}تغییر رمز با موفقیت{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">عملیات موفق</h4>
                </div>
                <div class="card-body text-center">
                    <div class="alert alert-success">
                        <i class="bi bi-check-circle-fill" style="font-size: 3rem;"></i>
                        <h5 class="mt-3">رمز عبور شما با موفقیت تغییر کرد!</h5>
                        <p>اکنون می‌توانید با رمز جدید وارد شوید.</p>
                    </div>
                    
                    <a href="{% url 'users:show_login' %}" class="btn btn-success">
                        ورود به حساب کاربری
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
