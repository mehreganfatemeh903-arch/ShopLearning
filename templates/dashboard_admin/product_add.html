{% extends 'dashboard_admin/base/base_dashboard_admin.html' %}

{% block title %}
List Users
{% endblock %}

{% block meta_data %}
<meta name="title" content="Dashboard Admin"/>
<meta name="author" content="javad"/>
<meta name="description" content="Dashboard Admin 30 example pages using Vanilla js."/>
<meta name="keywords" content="dashboard,adminlte"/>
{% endblock %}

{% block app-content %}

<style>
    body{
       background-color:#f8f9fa;
    }
    .card{
       border-radius:10px;
       box-shadow:0 4px 8px rgba(0,0,0,0.1);
    }
    .form-control:focus{
       border-color:#007bff;
       box-shadow:0 0 5px rgba(0,123,255,0.5);
    }
    .btn-primary{
       background-color:#007bff;
       border-color:#007bff;
       transition:all 0.3s ease;
    }
    .btn-primary:hover{
       background-color:#0056b3;
    }
</style>

<div class="container mt-5">
    <div class="card p-4">
        <h2 class="text-center mb-4">Add Product</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" name="category">
                    {% for i in category %}
                    <option value="{{ i.id }}"
                            {% if forms.category.value == i.id %}selected{% endif %}>
                        {{ i.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="name" class="form-label">Product Name</label>
                <input type="text"
                       class="form-control"
                       id="name"
                       name="name"
                       value="{{ forms.name.value|default_if_none:'' }}">
            </div>

            <div class="mb-3">
                <label for="slug" class="form-label">Slug</label>
                <input type="text"
                       class="form-control"
                       id="slug"
                       name="slug"
                       value="{{ forms.slug.value|default_if_none:'' }}">
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control"
                          id="description"
                          name="description"
                          rows="3">{{ forms.description.value|default_if_none:'' }}</textarea>
            </div>

            <div class="mb-3">
                <label for="price" class="form-label">Price</label>
                <input type="text"
                       class="form-control"
                       id="price"
                       name="price"
                       value="{{ forms.price.value|default_if_none:'' }}">
            </div>

            <div class="mb-3">
                <label for="image" class="form-label">Image</label>
                <input type="file"
                       class="form-control"
                       id="image"
                       name="image">

                <div>
                    {% if forms.instance.image %}
                    <img src="{{ forms.instance.image.url }}"
                         style="width:150px;height:150px;"
                         alt="{{ forms.name.value }}">
                    {% endif %}
                </div>
            </div>

            <div class="mb-3">
                <label for="stock" class="form-label">Stock</label>
                <input type="number"
                       class="form-control"
                       id="stock"
                       name="stock"
                       value="{{ forms.stock.value|default_if_none:'' }}">
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Submit
            </button>

        </form>
    </div>
</div>

{% endblock %}
