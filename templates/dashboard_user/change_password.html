{% extends 'dashboard_user/base/base_dashboard_user.html' %}

{% block app-content %}
<div class="card" style="max-width:500px; margin: 30px auto;">
    <div class="card-header bg-warning">
        <h3 class="card-title">
            <i class="bi bi-lock-fill me-2"></i>Change Password
        </h3>
    </div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            {% for field in forms %}
            <div class="mb-3">
                <label class="form-label fw-bold">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-warning">
                    <i class="bi bi-check-circle me-1"></i>Update Password
                </button>
                <a href="{% url 'profile_user_show' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
